# Formal scenario C: Cube is accessed through MCP; no native database.
# The deployment bootstrap supplies the MCP runtime and secrets.
project_name: tesis-condition-c
llm:
  providers:
    - provider: openai
      api_key: "{{ env('OPENAI_API_KEY') }}"
      base_url: "{{ env('OPENAI_BASE_URL') }}"
      models:
        - id: gpt-6-luna
          name: OpenAI - GPT-6 Luna
          default: true

    - provider: openrouter
      api_key: "{{ env('DEEPSEEK_API_KEY') }}"
      base_url: "https://api.deepseek.com"
      models:
        - id: deepseek-flash
          name: DeepSeek Flash
